name: Build Charge Alarm Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: 🔨 Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 🏷️ Rename APK
        run: |
          mkdir -p output
          VERSION="1.1.${{ github.run_number }}"
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} "output/charge-alarm-v${VERSION}-release.apk" \;
          ls -lh output/

      - name: 📦 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: charge-alarm-release-v1.1.${{ github.run_number }}
          path: output/*.apk
          retention-days: 30

      - name: 📊 Upload Reports (jika gagal)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: app/build/reports/
        continue-on-error: true

      - name: 🚀 Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Charge Alarm v1.1.${{ github.run_number }}
          body: |
            ## 🔋 Charge Alarm v1.1.${{ github.run_number }}

            ### Fitur
            - Alarm target baterai dengan suara + getar
            - 🗣️ Text-to-Speech looping sampai alarm dihentikan / charger dicabut
            - 🌡️ Temperature warning dengan batas suhu yang dapat diatur
            - 📊 Charging session history
            - ⚡ Estimasi charging speed dan waktu menuju target
            - Auto-start saat charger dicolok
            - Auto-stop saat charger dicabut
            - Background monitoring + boot recovery
            - UI baru dengan dashboard charging

            ### Install
            1. Download APK release.
            2. Install di Android 8+.
            3. Izinkan notifikasi.
            4. Izinkan aplikasi berjalan tanpa optimasi baterai untuk monitoring yang lebih stabil.
          files: output/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
