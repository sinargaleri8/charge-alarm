name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# ⚠️ WAJIB: agar bisa create release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: 🔨 Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 🔄 Rename APK ke nama custom
      - name: 🏷️ Rename APK
        run: |
          mkdir -p output
          VERSION="1.0.${{ github.run_number }}"
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output/charge-alarm-v${VERSION}.apk \;
          ls -la output/

      - name: 📦 Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: charge-alarm-v1.0.${{ github.run_number }}
          path: output/*.apk
          retention-days: 30

      - name: 📊 Upload Reports (jika gagal)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: app/build/reports/
        continue-on-error: true

      # 🚀 Auto-release ke GitHub Releases
      - name: 🚀 Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Charge Alarm v1.0.${{ github.run_number }}
          body: |
            ## 🔋 Charge Alarm v1.0.${{ github.run_number }}
            
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Tanggal:** ${{ github.event.head_commit.timestamp }}
            
            ### 📥 Cara Install
            1. Download `charge-alarm-v1.0.${{ github.run_number }}.apk`
            2. Buka di HP Android 8+
            3. Izinkan "Install from unknown sources"
            4. Install & buka app
            5. Klik "Izinkan Jalan di Background"
            6. Set batas → Aktifkan Alarm
            
            ### ✨ Fitur
            - Alarm saat baterai mencapai batas (default 80%)
            - Suara + getar + notifikasi
            - Tombol Tunda 1 menit
            - Auto-start setelah reboot
          files: output/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
