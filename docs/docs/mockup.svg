<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <!-- Phone frame -->
  <rect x="10" y="10" width="280" height="580" rx="30" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
  <rect x="20" y="40" width="260" height="540" rx="20" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="150" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="#2196F3">🔋 Charge Alarm</text>
  
  <!-- Status -->
  <text x="150" y="130" text-anchor="middle" font-size="14" fill="#4CAF50">Status: 🟢 Aktif</text>
  
  <!-- Limit -->
  <text x="150" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Batas: 80%</text>
  
  <!-- Seekbar -->
  <rect x="30" y="210" width="240" height="6" rx="3" fill="#ddd"/>
  <rect x="30" y="210" width="150" height="6" rx="3" fill="#2196F3"/>
  <circle cx="180" cy="213" r="12" fill="#2196F3"/>
  
  <!-- Switches -->
  <rect x="40" y="260" width="30" height="16" rx="8" fill="#4CAF50"/>
  <circle cx="62" cy="268" r="6" fill="white"/>
  <text x="80" y="273" font-size="13" fill="#333">Bunyikan suara alarm</text>
  
  <rect x="40" y="300" width="30" height="16" rx="8" fill="#4CAF50"/>
  <circle cx="62" cy="308" r="6" fill="white"/>
  <text x="80" y="313" font-size="13" fill="#333">Getarkan HP</text>
  
  <rect x="40" y="340" width="30" height="16" rx="8" fill="#4CAF50"/>
  <circle cx="62" cy="348" r="6" fill="white"/>
  <text x="80" y="353" font-size="13" fill="#333">Tombol Tunda</text>
  
  <!-- Start button -->
  <rect x="40" y="400" width="220" height="45" rx="8" fill="#2196F3"/>
  <text x="150" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="white">▶️ Aktifkan Alarm</text>
  
  <!-- Stop button -->
  <rect x="40" y="460" width="220" height="45" rx="8" fill="#f44336"/>
  <text x="150" y="488" text-anchor="middle" font-size="15" font-weight="bold" fill="white">⏹️ Matikan Alarm</text>
  
  <!-- Battery opt button -->
  <rect x="40" y="520" width="220" height="40" rx="8" fill="none" stroke="#2196F3" stroke-width="2"/>
  <text x="150" y="545" text-anchor="middle" font-size="13" fill="#2196F3">🔋 Izinkan Jalan di Background</text>
</svg>
